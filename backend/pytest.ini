[pytest]
asyncio_mode = auto
testpaths = tests

# 🔴 required_plugins: sin esto, si pytest-asyncio NO está cargado en el intérprete
# que corre pytest, `asyncio_mode = auto` se ignora con un simple warning
# ("Unknown config option: asyncio_mode") y los 54 tests `async def` NO fallan:
# se SALTEAN. El total sigue pareciendo el mismo y nadie se entera.
# Con required_plugins, pytest ABORTA al arrancar en vez de reportar verde a medias.
required_plugins = pytest-asyncio

# -rs: todo skip sale listado con su razón al final del run. Un test que deja de
# ejecutarse tiene que ser visible sin tener que acordarse de pasar el flag.
addopts = -rs
